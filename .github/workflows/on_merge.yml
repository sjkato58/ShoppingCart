name: On Merge

on:
  push:
    branches: [ "develop", "main" ] # Run when code is merged into these branches

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needs write permission to update the dependency graph in GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v4
        # This action automatically detects all your modules 
        # (Android, Java, Kotlin) and tells GitHub about them.