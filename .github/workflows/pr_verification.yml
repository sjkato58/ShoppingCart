# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: PR Verification

on:
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Initialize
      uses: ./.github/actions/setup-project
      with:
        cache-read-only: 'true'

    - name: Run Android Lint
      run: ./gradlew lintDebug

    - name: Upload Lint Report
      if: always() # Upload even if lint finds errors so you can read them
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: '**/build/reports/lint-results-*.html'

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Initialize
      uses: ./.github/actions/setup-project
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

    - name: Run Unit Tests
      # We run testDebugUnitTest specifically.
      # It's faster than 'build' and covers compilation + testing.
      run: ./gradlew testDebugUnitTest --stacktrace

    # Optional: Only upload reports if a test fails so you can see why
    - name: Upload Test Reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: '**/build/reports/tests/'